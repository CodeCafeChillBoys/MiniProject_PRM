name: miniproject
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.0.0 # DI CHUYỂN LÊN ĐÂY (Ngang hàng với cupertino_icons)
  audioplayers: ^6.0.0
